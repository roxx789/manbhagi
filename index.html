  <script>
    var isClicked = false;
    var telegramUrl = "https://t.me/+zhRMj91gbZg0Mjg1"; 
    var pageLoadTime = Date.now();

    if (sessionStorage.getItem('hasClickedTelegram')) {
        isClicked = true;
    }

    // Cookie reader helper for _fbp and _fbc
    function getCookie(name) {
        let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
    }

    function trackButtonClick() {
        var currentTime = Date.now();
        var timeSpent = (currentTime - pageLoadTime) / 1000;

        if (timeSpent < 0.8) {
            window.location.href = telegramUrl;
            return;
        }

        if (!isClicked) {
            isClicked = true;
            sessionStorage.setItem('hasClickedTelegram', 'true');

            // Generate Unique Event ID for Deduplication
            var leadEventId = 'lead_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

            // 1. Fire Browser Pixel Event with Event ID (Subscribe Event)
            if (typeof fbq !== 'undefined') {
                fbq('track', 'Subscribe', {}, {eventID: leadEventId});
            }

            // 2. Send Data to Server CAPI (/api/capi) in background
            var payload = JSON.stringify({
                event_name: 'Subscribe',
                event_id: leadEventId,
                event_source_url: window.location.href,
                fbp: getCookie('_fbp'),
                fbc: getCookie('_fbc')
            });

            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/capi', payload);
            } else {
                fetch('/api/capi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload,
                    keepalive: true
                }).catch(function(err) {});
            }

            var btn = document.getElementById('telegramLink');
            if (btn) {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.7';
                btn.style.backgroundColor = '#ffd61a';
                btn.innerText = "Redirecting...";
            }

            setTimeout(function() {
                window.location.href = telegramUrl;
            }, 500);
        } else {
            window.location.href = telegramUrl;
        }
    }

    var timeLeft = 40;
    var timerElement = document.getElementById('timer');
    var countdown = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
            timerElement.innerText = "Redirecting in " + timeLeft + "...";
        } else {
            clearInterval(countdown);
            timerElement.innerText = "Redirecting now...";
            trackButtonClick();
        }
    }, 1000);
  </script>
